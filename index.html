<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jank-lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style/index.css" />
    <script type="importmap">
      {
        "imports": {
          "@faker-js/faker": "/node_modules/@faker-js/faker/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="app" id="root">
      <header class="masthead cluster">
        <h1>Jank Lab</h1>
        <dl class="metrics">
          <div class="metric">
            <dt>rows</dt>
            <dd data-metric="row-count">&mdash;</dd>
          </div>
          <div class="metric">
            <dt>in dom</dt>
            <dd data-metric="dom-rows">&mdash;</dd>
          </div>
          <div class="metric">
            <dt>generate</dt>
            <dd data-metric="generate">&mdash;</dd>
          </div>
          <div class="metric">
            <dt>render</dt>
            <dd data-metric="render">&mdash;</dd>
          </div>
        </dl>
        <button
          class="burguer"
          id="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="settings"
        >
          <span class="burguer__bar" aria-hidden="true"></span>
          <span class="visually-hidden">Settings</span>
        </button>
      </header>
      <main class="content">
        <section class="settings" id="settings">
          <nav
            class="settings__rail"
            aria-label="Settings sections, first half"
          >
            <ol role="list" class="cluster turned-up">
              <li><a href="#set-presets">Presets</a></li>
              <li><a href="#set-data">Data</a></li>
              <li><a href="#set-build">Build</a></li>
              <li><a href="#set-layout">Layout</a></li>
            </ol>
          </nav>
          <div class="settings__scroller">
            <section class="settings__section" id="set-presets">
              <h2>Presets</h2>
            </section>
            <section class="settings__section" id="set-data">
              <h2>Data</h2>

              <div class="field">
                <label class="field__label" for="row-count">
                  Rows
                  <output class="field__value" id="row-count-output"
                    >100</output
                  >
                </label>
                <input
                  class="field__range"
                  type="range"
                  id="row-count"
                  min="1"
                  max="5"
                  step="1"
                  value="1"
                />
              </div>

              <fieldset class="field">
                <legend class="field__label">Source</legend>
                <label class="choice">
                  <input
                    type="radio"
                    name="data-source"
                    value="faker"
                    checked
                  />
                  faker &mdash; realistic, expensive
                </label>
                <label class="choice">
                  <input type="radio" name="data-source" value="cheap" />
                  cheap &mdash; synthetic, near-zero
                </label>
              </fieldset>
            </section>
            <section class="settings__section" id="set-build">
              <h2>Build</h2>

              <fieldset class="field" id="build-strategy">
                <legend class="field__label">Insertion</legend>
              </fieldset>

              <div class="field">
                <button class="button" id="verify-strategies" type="button">
                  Verify identical DOM
                </button>
                <p class="note" id="verify-result" aria-live="polite">
                  Comparing strategies is only fair if every one of them emits
                  the same markup.
                </p>
              </div>
            </section>
            <section class="settings__section" id="set-layout">
              <h2>Layout</h2>
            </section>
            <section class="settings__section" id="set-paint">
              <h2>Paint</h2>
            </section>
            <section class="settings__section" id="set-time">
              <h2>Time</h2>
            </section>
            <section class="settings__section" id="set-memory">
              <h2>Memory</h2>
            </section>
            <section class="settings__section" id="set-runs">
              <h2>Runs</h2>
            </section>
          </div>
          <nav
            class="settings__rail"
            aria-label="Settings sections, second half"
          >
            <ol role="list" class="cluster turned-down">
              <li><a href="#set-paint">Paint</a></li>
              <li><a href="#set-time">Time</a></li>
              <li><a href="#set-memory">Memory</a></li>
              <li><a href="#set-runs">Runs</a></li>
            </ol>
          </nav>
          <footer class="settings__footer">
            <button class="cta" id="new-render" type="button">
              New render
            </button>
          </footer>
        </section>
        <div class="rows" id="rows">
          <div class="rows__list" id="rows-list">
            <div class="rows__surface" id="rows-surface"></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
